<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Circle Wall</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#070707;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
header{height:9vh;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,3vw,46px);font-weight:800;letter-spacing:.04em}
#wall{height:91vh;padding:1.5vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-auto-rows:180px;gap:18px;align-content:start;overflow:hidden}
.card{position:relative;display:flex;align-items:center;justify-content:center;animation:appear .55s ease-out}
.card video{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#151515;box-shadow:0 0 0 3px rgba(255,255,255,.1),0 10px 40px rgba(0,0,0,.45)}
.card.new{position:fixed;z-index:20;left:50%;top:50%;width:min(62vh,62vw);height:min(62vh,62vw);transform:translate(-50%,-50%);animation:hero .65s cubic-bezier(.2,.8,.2,1)}
.card.new video{box-shadow:0 0 0 6px rgba(255,255,255,.16),0 0 80px rgba(255,255,255,.12)}
#shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:10}
#empty{position:fixed;inset:9vh 0 0;display:flex;align-items:center;justify-content:center;color:#777;font-size:clamp(18px,2.5vw,34px)}
@keyframes appear{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes hero{from{opacity:0;transform:translate(-50%,-50%) scale(.45)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<header>🎥 LIVE CIRCLE WALL</header>
<div id="empty">Надішліть кружечок у Telegram-бота</div>
<div id="shade"></div>
<main id="wall"></main>

<script>
const wall = document.getElementById('wall');
const empty = document.getElementById('empty');
const shade = document.getElementById('shade');

function addCard(item, isNew=false) {
  const card = document.createElement('div');
  card.className = 'card' + (isNew ? ' new' : '');
  const video = document.createElement('video');
  video.src = item.url;
  video.autoplay = isNew;
  video.muted = !isNew;
  video.playsInline = true;
  video.loop = false;
  card.appendChild(video);

  if (isNew) {
    shade.style.display = 'block';
    wall.appendChild(card);
    video.onended = () => {
      card.remove();
      shade.style.display = 'none';
      addCard(item, false);
    };
    setTimeout(() => {
      if (!video.ended) {
        video.play().catch(()=>{});
      }
    }, 50);
  } else {
    wall.prepend(card);
  }
  empty.style.display = 'none';
}

async function loadExisting() {
  const res = await fetch('/api/videos');
  const items = await res.json();
  items.forEach(item => addCard(item, false));
  if (!items.length) empty.style.display = 'flex';
}

const stream = new EventSource('/api/events');
stream.onmessage = e => {
  const item = JSON.parse(e.data);
  addCard(item, true);
};

loadExisting();
</script>
</body>
</html>
