
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крістіан та Світлана</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --wall-background: #070707;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--wall-background);
    color: white;
    font-family: Arial, sans-serif;
}

body {
    transition: background-color 0.25s ease;
}

header {
    height: 8vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 70px;
    text-align: center;
    font-size: clamp(18px, 2.5vw, 34px);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}

#wall {
    width: 100%;
    height: 92vh;
    display: grid;
    align-content: center;
    justify-content: center;
    justify-items: center;
    align-items: center;
    gap: clamp(6px, 1.2vw, 18px);
    padding: 10px;
    overflow: hidden;
}

.card {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: #151515;
    animation: appear 0.45s ease-out;
    box-shadow:
        0 0 0 2px rgba(255,255,255,0.16),
        0 8px 30px rgba(0,0,0,0.35);
}

.card video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

#empty {
    position: fixed;
    inset: 8vh 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.75);
    font-size: clamp(18px, 2.5vw, 32px);
    text-align: center;
    padding: 20px;
}

#controls {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
}

.control-button {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 50%;
    background: rgba(20,20,20,0.82);
    color: white;
    font-size: 23px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    transition: transform 0.15s, background 0.15s;
}

.control-button:hover {
    transform: scale(1.08);
    background: rgba(55,55,55,0.95);
}

#colorPicker {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

#colorLabel {
    position: relative;
}

#clearButton:hover {
    background: rgba(150,35,35,0.95);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 600px) {
    #controls {
        right: 12px;
        bottom: 12px;
        gap: 8px;
    }

    .control-button {
        width: 44px;
        height: 44px;
        font-size: 21px;
    }

    header {
        padding: 0 12px;
        font-size: clamp(17px, 5vw, 26px);
    }
}
</style>
</head>

<body>

<header>💍 Крістіан та Світлана 💍</header>

<div id="empty">
    Надішліть кружечок у Telegram-бота ❤️
</div>

<main id="wall"></main>

<div id="controls">
    <label class="control-button" title="Завантажити фон"
           aria-label="Завантажити фонове зображення">
        🖼️
        <input id="backgroundPicker" type="file"
               accept="image/*"
               style="display:none">
    </label>

    <button id="titleButton" class="control-button"
            title="Змінити назву">✏️</button>

    <button id="clearButton" class="control-button"
            title="Очистити всі кружечки">🗑️</button>

    <button id="fullscreenButton" class="control-button"
            title="На весь екран">⛶</button>
</div>

<script>
const wall = document.getElementById("wall");
const empty = document.getElementById("empty");
const backgroundPicker = document.getElementById("backgroundPicker");
const titleButton = document.getElementById("titleButton");
const clearButton = document.getElementById("clearButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const pageTitle = document.querySelector("header");

const videos = new Map();

// Збереження налаштувань у браузері
const DB_NAME = "CircleWallSettings";
const STORE_NAME = "settings";

function openSettingsDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = () => {
            request.result.createObjectStore(STORE_NAME);
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function saveSetting(key, value) {
    const db = await openSettingsDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).put(value, key);

        transaction.oncomplete = () => {
            db.close();
            resolve();
        };

        transaction.onerror = () => {
            db.close();
            reject(transaction.error);
        };
    });
}

async function getSetting(key) {
    const db = await openSettingsDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readonly");
        const request = transaction.objectStore(STORE_NAME).get(key);

        request.onsuccess = () => {
            db.close();
            resolve(request.result);
        };

        request.onerror = () => {
            db.close();
            reject(request.error);
        };
    });
}

// Відновлення назви та фону
async function restoreSettings() {
    try {
        const savedTitle = localStorage.getItem("circleWallTitle");

        if (savedTitle) {
            pageTitle.textContent = savedTitle;
        }

        const savedBackground = await getSetting("backgroundImage");

        if (savedBackground) {
            document.body.style.backgroundImage =
                `url("${savedBackground}")`;
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundRepeat = "no-repeat";
        }
    } catch (error) {
        console.error("Помилка відновлення налаштувань:", error);
    }
}

restoreSettings();

// Зміна назви сторінки
titleButton.addEventListener("click", () => {
    const newTitle = prompt(
        "Введи нову назву:",
        pageTitle.textContent
    );

    if (newTitle !== null && newTitle.trim() !== "") {
        const title = newTitle.trim();
        pageTitle.textContent = title;

        try {
            localStorage.setItem("circleWallTitle", title);
        } catch (error) {
            alert("Не вдалося зберегти назву.");
        }
    }
});

// Завантаження фонового зображення з комп'ютера
backgroundPicker.addEventListener("change", async () => {
    const file = backgroundPicker.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Вибери файл із зображенням.");
        backgroundPicker.value = "";
        return;
    }

    if (file.size > 15 * 1024 * 1024) {
        alert("Зображення має бути меншим за 15 МБ.");
        backgroundPicker.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = async () => {
        try {
            const imageData = reader.result;

            await saveSetting("backgroundImage", imageData);

            document.body.style.backgroundImage =
                `url("${imageData}")`;
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundRepeat = "no-repeat";
        } catch (error) {
            console.error(error);
            alert("Не вдалося зберегти фон.");
        }
    };

    reader.onerror = () => {
        alert("Не вдалося прочитати зображення.");
    };

    reader.readAsDataURL(file);
});

// Розмір кружечків залежно від їх кількості
function updateLayout() {
    const count = videos.size;

    if (count === 0) {
        empty.style.display = "flex";
        wall.style.display = "none";
        return;
    }

    empty.style.display = "none";
    wall.style.display = "grid";

    const width = wall.clientWidth - 20;
    const height = wall.clientHeight - 20;
    const gap = Math.min(18, Math.max(6, width * 0.012));

    const cols = count <= 4
        ? Math.ceil(Math.sqrt(count))
        : Math.min(
            count,
            Math.max(1, Math.round(Math.sqrt(count * width / height)))
        );

    const rows = Math.ceil(count / cols);

    const size = Math.floor(Math.max(
        1,
        Math.min(
            (width - gap * (cols - 1)) / cols,
            (height - gap * (rows - 1)) / rows,
            count === 1 ? Math.min(width, height) * 0.88 : Infinity
        )
    ));

    wall.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    wall.style.gridAutoRows = `${size}px`;
    wall.style.gap = `${gap}px`;
}

// Видалення кружечків з екрана
function removeAllCards() {
    for (const card of videos.values()) {
        const video = card.querySelector("video");

        if (video) {
            video.pause();
            video.removeAttribute("src");
            video.load();
        }

        card.remove();
    }

    videos.clear();
    updateLayout();
}

// Додавання нового відео
function addCard(item) {
    if (!item || !item.id || !item.url || videos.has(item.id)) {
        return;
    }

    const card = document.createElement("div");
    card.className = "card";

    const video = document.createElement("video");
    video.src = item.url;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.preload = "auto";

    video.addEventListener("error", () => {
        console.error("Не вдалося відтворити відео:", item.url);
    });

    card.appendChild(video);
    wall.appendChild(card);
    videos.set(item.id, card);

    updateLayout();

    video.play().catch(error => {
        console.warn("Автовідтворення відео:", error);
    });
}

// Завантаження наявних відео
async function loadExisting() {
    try {
        const response = await fetch("/api/videos");

        if (!response.ok) {
            throw new Error("Не вдалося завантажити відео");
        }

        const items = await response.json();
        items.forEach(addCard);
    } catch (error) {
        console.error(error);
    }
}

// Отримання нових відео від сервера
const stream = new EventSource("/api/events");

stream.onmessage = event => {
    try {
        const item = JSON.parse(event.data);

        if (item.type === "clear") {
            removeAllCards();
            return;
        }

        addCard(item);
    } catch (error) {
        console.error("Помилка оновлення стіни:", error);
    }
};

stream.onerror = () => {
    console.warn("З'єднання з сервером відновлюється...");
};

// Кнопка очищення всіх кружечків
clearButton.addEventListener("click", async () => {
    const confirmed = confirm(
        "Точно очистити всі кружечки? Відео буде видалено із сервера."
    );

    if (!confirmed) return;

    clearButton.disabled = true;

    try {
        const response = await fetch("/api/videos/clear", {
            method: "POST"
        });

        if (!response.ok) {
            throw new Error("Не вдалося очистити кружечки");
        }

        const result = await response.json();
        removeAllCards();

        alert(`Готово! Видалено кружечків: ${result.deleted}`);
    } catch (error) {
        console.error(error);
        alert("Не вдалося очистити кружечки. Перевір сервер.");
    } finally {
        clearButton.disabled = false;
    }
});

// Повноекранний режим
fullscreenButton.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        alert("Не вдалося ввімкнути повноекранний режим.");
    }
});

document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent =
        document.fullscreenElement ? "⤢" : "⛶";

    fullscreenButton.title =
        document.fullscreenElement
            ? "Вийти з повноекранного режиму"
            : "На весь екран";

    setTimeout(updateLayout, 100);
});

window.addEventListener("resize", updateLayout);

// Запуск сторінки
loadExisting();
</script>
</body>
</html>
