
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Circle Wall</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070707;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 8vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 2.5vw, 34px);
    font-weight: 800;
    letter-spacing: 2px;
}

#wall {
    width: 100%;
    height: 92vh;
    display: grid;
    align-content: center;
    justify-content: center;
    justify-items: center;
    align-items: center;
    gap: clamp(6px, 1.2vw, 18px);
    padding: 10px;
    overflow: hidden;
}

.card {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: #151515;
    animation: appear 0.45s ease-out;
    box-shadow:
        0 0 0 2px rgba(255,255,255,0.12),
        0 8px 30px rgba(0,0,0,0.5);
}

.card video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

#empty {
    position: fixed;
    inset: 8vh 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: clamp(18px, 2.5vw, 32px);
    text-align: center;
    padding: 20px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<header>🎥 LIVE CIRCLE WALL</header>

<div id="empty">
    Надішліть кружечок у Telegram-бота
</div>

<main id="wall"></main>

<script>
const wall = document.getElementById("wall");
const empty = document.getElementById("empty");

const videos = new Map();

function updateLayout() {
    const count = videos.size;

    if (count === 0) {
        empty.style.display = "flex";
        wall.style.display = "none";
        return;
    }

    empty.style.display = "none";
    wall.style.display = "grid";

    const width = wall.clientWidth - 20;
    const height = wall.clientHeight - 20;
    const gap = Math.min(18, Math.max(6, width * 0.012));

    // One large circle; more circles share the available space.
    const cols = count <= 4
        ? Math.ceil(Math.sqrt(count))
        : Math.min(
            count,
            Math.max(
                1,
                Math.round(Math.sqrt(count * width / height))
            )
        );

    const rows = Math.ceil(count / cols);

    const size = Math.floor(Math.max(
        1,
        Math.min(
            (width - gap * (cols - 1)) / cols,
            (height - gap * (rows - 1)) / rows,
            count === 1 ? Math.min(width, height) * 0.88 : Infinity
        )
    ));

    wall.style.gridTemplateColumns =
        `repeat(${cols}, ${size}px)`;

    wall.style.gridAutoRows = `${size}px`;
    wall.style.gap = `${gap}px`;
}

function addCard(item) {
    if (videos.has(item.id)) {
        return;
    }

    const card = document.createElement("div");
    card.className = "card";

    const video = document.createElement("video");
    video.src = item.url;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.preload = "auto";

    video.addEventListener("error", () => {
        console.error("Не вдалося відтворити відео:", item.url);
    });

    card.appendChild(video);
    wall.appendChild(card);

    videos.set(item.id, card);

    // Recalculate every circle's size when a new one arrives.
    updateLayout();

    video.play().catch(error => {
        console.warn("Автовідтворення відео:", error);
    });
}

async function loadExisting() {
    try {
        const response = await fetch("/api/videos");
        if (!response.ok) {
            throw new Error("Не вдалося завантажити відео");
        }

        const items = await response.json();

        items.forEach(item => addCard(item));
    } catch (error) {
        console.error(error);
    }
}

const stream = new EventSource("/api/events");

stream.onmessage = event => {
    try {
        const item = JSON.parse(event.data);
        addCard(item);
    } catch (error) {
        console.error("Помилка нового відео:", error);
    }
};

stream.onerror = () => {
    console.warn("З'єднання з сервером відновлюється...");
};

window.addEventListener("resize", updateLayout);

loadExisting();
</script>

</body>
</html>
