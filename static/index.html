
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Святкові кружечки</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --wall-background: #070707;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--wall-background);
    color: white;
    font-family: Arial, sans-serif;
}

body {
    transition: background-color 0.25s ease;    
}

/* Затемнення фонового зображення */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    pointer-events: none;
    z-index: 0;
    transition: background 0.5s ease;
}

body.wall-has-videos::before {
    background: rgba(0, 0, 0, 0.38);
}

/* Кружечки та кнопки залишаються поверх затемнення */
header,
#wall,
#empty,
#controls {
    position: relative;
    z-index: 1;
}

#controls {
    position: fixed;
    z-index: 100;
}

    
    

header {
   height: 10vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 70px;
    text-align: center;
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(34px, 5vw, 64px);
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #fff4df;
    text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.65),
        0 0 18px rgba(0, 0, 0, 0.4);
}

#wall {
    width: 100%;
    height: 92vh;
    display: grid;
    align-content: center;
    justify-content: center;
    justify-items: center;
    align-items: center;
    gap: clamp(6px, 1.2vw, 18px);
    padding: 10px;
    overflow: hidden;
}

.card {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    overflow: visible;
    background: transparent;
    animation: appear 0.45s ease-out;
}

.card video {
    display: block;
    flex: 0 0 calc(100% - 24px);
    width: calc(100% - 24px);
    height: calc(100% - 24px);
    min-width: 0;
    min-height: 0;
    object-fit: cover;
    border-radius: 50%;
    box-shadow:
        0 0 0 2px rgba(255,255,255,0.16),
        0 8px 30px rgba(0,0,0,0.35);
}

.sender-name {
    display: block;
    width: 100%;
    height: 18px;
    flex: 0 0 18px;
    overflow: hidden;
    color: #fff;
    font-size: clamp(10px, 1.1vw, 16px);
    line-height: 18px;
    font-weight: 600;
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.95),
        0 0 8px rgba(0, 0, 0, 0.9);
}

/* Перегляд кружечка у великому розмірі */
.video-modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 24px;
    background: rgba(0, 0, 0, 0.88);
    cursor: pointer;
}

.video-modal.open {
    display: flex;
}

.video-modal video {
    display: block;
    width: min(78vw, 72vh);
    height: min(78vw, 72vh);
    max-width: calc(100vw - 36px);
    max-height: calc(100vh - 110px);
    object-fit: contain;
    border-radius: 50%;
    background: #111;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 12px 50px rgba(0,0,0,0.6);
    cursor: default;
}

.video-modal-name {
    max-width: 90vw;
    color: #fff;
    font-size: clamp(18px, 2.5vw, 30px);
    font-weight: 700;
    text-align: center;
    text-shadow: 0 2px 8px #000;
}

.video-modal-hint {
    color: rgba(255,255,255,0.75);
    font-size: 14px;
    text-align: center;
}

#empty {
    position: fixed;
    inset: 10vh 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    color: #fff4df;
    z-index: 2;
}

.qr-link {
    display: block;
    width: clamp(190px, 30vw, 310px);
    aspect-ratio: 1;
    padding: 10px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 45px rgba(0, 0, 0, 0.35);
    transition: transform 0.2s ease;
}

.qr-link:hover {
    transform: scale(1.03);
}

.qr-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 14px;
}

.qr-caption {
    max-width: 700px;
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(26px, 3.5vw, 42px);
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
}

.qr-subtitle {
    font-family: Arial, sans-serif;
    font-size: clamp(14px, 1.5vw, 19px);
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}

@media (max-width: 600px) {
    #empty {
        gap: 14px;
        padding: 16px;
    }

    .qr-link {
        width: min(68vw, 270px);
    }
}

#controls {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
}

.control-button {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 50%;
    background: rgba(20,20,20,0.82);
    color: white;
    font-size: 23px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    transition: transform 0.15s, background 0.15s;
}

.control-button:hover {
    transform: scale(1.08);
    background: rgba(55,55,55,0.95);
}

#colorPicker {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

#colorLabel {
    position: relative;
}

#clearButton:hover {
    background: rgba(150,35,35,0.95);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 600px) {
    #controls {
        right: 12px;
        bottom: 12px;
        gap: 8px;
    }

    .control-button {
        width: 44px;
        height: 44px;
        font-size: 21px;
    }

    header {
        padding: 0 12px;
        font-size: clamp(17px, 5vw, 26px);
    }
}
</style>
</head>

<body>

<header>💍 Крістіан та Світлана 💍</header>

<div id="empty">
    <a
        href="https://t.me/my_party_circle_wall_bot"
        target="_blank"
        rel="noopener noreferrer"
        class="qr-link"
    >
        <img
            src="/static/telegram-circle-wall.png"
            alt="QR-код для переходу в Telegram-бот"
            class="qr-image"
        >
    </a>

    <div class="qr-caption">
        Надішліть кружечок у Telegram-бота ❤️
    </div>

    <div class="qr-subtitle">
        Наведіть камеру телефона на QR-код
    </div>
</div>

<main id="wall"></main>

<div id="videoModal" class="video-modal" aria-hidden="true" title="Натисни поза відео, щоб закрити">
    <video id="modalVideo" controls playsinline></video>
    <div id="modalVideoName" class="video-modal-name"></div>
    <div class="video-modal-hint">Натисни поза відео або Esc, щоб закрити</div>
</div>

<div id="controls">
    <label class="control-button" title="Завантажити фон"
           aria-label="Завантажити фонове зображення">
        🖼️
        <input id="backgroundPicker" type="file"
               accept="image/*"
               style="display:none">
    </label>

    <button id="titleButton" class="control-button"
            title="Змінити назву">✏️</button>

    <button id="clearButton" class="control-button"
            title="Очистити всі кружечки">🗑️</button>

    <button id="fullscreenButton" class="control-button"
            title="На весь екран">⛶</button>
</div>

<script>
const wall = document.getElementById("wall");
const empty = document.getElementById("empty");
const backgroundPicker = document.getElementById("backgroundPicker");
const titleButton = document.getElementById("titleButton");
const clearButton = document.getElementById("clearButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const pageTitle = document.querySelector("header");
const videoModal = document.getElementById("videoModal");
const modalVideo = document.getElementById("modalVideo");
const modalVideoName = document.getElementById("modalVideoName");

const videos = new Map();

// Збереження налаштувань у браузері
const DB_NAME = "CircleWallSettings";
const STORE_NAME = "settings";

function openSettingsDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = () => {
            request.result.createObjectStore(STORE_NAME);
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function saveSetting(key, value) {
    const db = await openSettingsDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).put(value, key);

        transaction.oncomplete = () => {
            db.close();
            resolve();
        };

        transaction.onerror = () => {
            db.close();
            reject(transaction.error);
        };
    });
}

async function getSetting(key) {
    const db = await openSettingsDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readonly");
        const request = transaction.objectStore(STORE_NAME).get(key);

        request.onsuccess = () => {
            db.close();
            resolve(request.result);
        };

        request.onerror = () => {
            db.close();
            reject(request.error);
        };
    });
}

// Відновлення назви та фону
async function restoreSettings() {
    try {
        const savedTitle = localStorage.getItem("circleWallTitle");

        if (savedTitle) {
            pageTitle.textContent = savedTitle;
        }

        const savedBackground = await getSetting("backgroundImage");

        if (savedBackground) {
            document.body.style.backgroundImage =
                `url("${savedBackground}")`;
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundRepeat = "no-repeat";
        }
    } catch (error) {
        console.error("Помилка відновлення налаштувань:", error);
    }
}

restoreSettings();

// Зміна назви сторінки
titleButton.addEventListener("click", () => {
    const newTitle = prompt(
        "Введи нову назву:",
        pageTitle.textContent
    );

    if (newTitle !== null && newTitle.trim() !== "") {
        const title = newTitle.trim();
        pageTitle.textContent = title;

        try {
            localStorage.setItem("circleWallTitle", title);
        } catch (error) {
            alert("Не вдалося зберегти назву.");
        }
    }
});

// Завантаження фонового зображення з комп'ютера
backgroundPicker.addEventListener("change", async () => {
    const file = backgroundPicker.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Вибери файл із зображенням.");
        backgroundPicker.value = "";
        return;
    }

    if (file.size > 15 * 1024 * 1024) {
        alert("Зображення має бути меншим за 15 МБ.");
        backgroundPicker.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = async () => {
        try {
            const imageData = reader.result;

            await saveSetting("backgroundImage", imageData);

            document.body.style.backgroundImage =
                `url("${imageData}")`;
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundRepeat = "no-repeat";
        } catch (error) {
            console.error(error);
            alert("Не вдалося зберегти фон.");
        }
    };

    reader.onerror = () => {
        alert("Не вдалося прочитати зображення.");
    };

    reader.readAsDataURL(file);
});

// Розмір кружечків залежно від їх кількості
function updateLayout() {
    const count = videos.size;

    if (count === 0) {
        empty.style.display = "flex";
        wall.style.display = "none";
        return;
    }

    empty.style.display = "none";
    wall.style.display = "grid";

    const width = wall.clientWidth - 20;
    const height = wall.clientHeight - 20;
    const gap = Math.min(18, Math.max(6, width * 0.012));

    const cols = count <= 4
        ? Math.ceil(Math.sqrt(count))
        : Math.min(
            count,
            Math.max(1, Math.round(Math.sqrt(count * width / height)))
        );

    const rows = Math.ceil(count / cols);

    const size = Math.floor(Math.max(
        1,
        Math.min(
            (width - gap * (cols - 1)) / cols,
            (height - gap * (rows - 1)) / rows,
            count === 1 ? Math.min(width, height) * 0.88 : Infinity
        )
    ));

    wall.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    wall.style.gridAutoRows = `${size}px`;
    wall.style.gap = `${gap}px`;
}

// Відкриття відео у великому розмірі
function openVideoModal(item) {
    modalVideo.src = item.url;
    modalVideoName.textContent = item.sender || "Гість";
    videoModal.classList.add("open");
    videoModal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    modalVideo.currentTime = 0;
    modalVideo.play().catch(error => {
        console.warn("Не вдалося запустити збільшене відео:", error);
    });
}

function closeVideoModal() {
    videoModal.classList.remove("open");
    videoModal.setAttribute("aria-hidden", "true");
    modalVideo.pause();
    modalVideo.removeAttribute("src");
    modalVideo.load();
    document.body.style.overflow = "hidden";
}

videoModal.addEventListener("click", event => {
    if (event.target === videoModal) {
        closeVideoModal();
    }
});

modalVideo.addEventListener("click", event => {
    event.stopPropagation();
});

window.addEventListener("keydown", event => {
    if (event.key === "Escape" && videoModal.classList.contains("open")) {
        closeVideoModal();
    }
});

// Видалення кружечків з екрана
function removeAllCards() {
    for (const card of videos.values()) {
        const video = card.querySelector("video");

        if (video) {
            video.pause();
            video.removeAttribute("src");
            video.load();
        }

        card.remove();
    }

    videos.clear();
    document.body.classList.remove("wall-has-videos");
    updateLayout();
}

// Додавання нового відео
function addCard(item) {
    if (!item || !item.id || !item.url || videos.has(item.id)) {
        return;
    }

    const card = document.createElement("div");
    card.className = "card";

    const video = document.createElement("video");
    video.src = item.url;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.preload = "auto";

    video.addEventListener("error", () => {
        console.error("Не вдалося відтворити відео:", item.url);
    });

    video.title = "Натисни, щоб збільшити відео";
    video.style.cursor = "pointer";
    video.addEventListener("click", () => openVideoModal(item));

    card.appendChild(video);

    const sender = document.createElement("div");
    sender.className = "sender-name";
    sender.textContent = item.sender || "Гість";
    sender.title = item.sender || "Гість";
    card.appendChild(sender);

    wall.appendChild(card);
    videos.set(item.id, card);
    document.body.classList.add("wall-has-videos");

    updateLayout();

    video.play().catch(error => {
        console.warn("Автовідтворення відео:", error);
    });
}

// Завантаження наявних відео
async function loadExisting() {
    try {
        const response = await fetch("/api/videos");

        if (!response.ok) {
            throw new Error("Не вдалося завантажити відео");
        }

        const items = await response.json();
        items.forEach(addCard);
    } catch (error) {
        console.error(error);
    }
}

// Отримання нових відео від сервера
const stream = new EventSource("/api/events");

stream.onmessage = event => {
    try {
        const item = JSON.parse(event.data);

        if (item.type === "clear") {
            removeAllCards();
            return;
        }

        addCard(item);
    } catch (error) {
        console.error("Помилка оновлення стіни:", error);
    }
};

stream.onerror = () => {
    console.warn("З'єднання з сервером відновлюється...");
};

// Кнопка очищення всіх кружечків
clearButton.addEventListener("click", async () => {
    const confirmed = confirm(
        "Точно очистити всі кружечки? Відео буде видалено із сервера."
    );

    if (!confirmed) return;

    clearButton.disabled = true;

    try {
        const response = await fetch("/api/videos/clear", {
            method: "POST"
        });

        if (!response.ok) {
            throw new Error("Не вдалося очистити кружечки");
        }

        const result = await response.json();
        removeAllCards();

        alert(`Готово! Видалено кружечків: ${result.deleted}`);
    } catch (error) {
        console.error(error);
        alert("Не вдалося очистити кружечки. Перевір сервер.");
    } finally {
        clearButton.disabled = false;
    }
});

// Повноекранний режим
fullscreenButton.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        alert("Не вдалося ввімкнути повноекранний режим.");
    }
});

document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent =
        document.fullscreenElement ? "⤢" : "⛶";

    fullscreenButton.title =
        document.fullscreenElement
            ? "Вийти з повноекранного режиму"
            : "На весь екран";

    setTimeout(updateLayout, 100);
});

window.addEventListener("resize", updateLayout);

// Запуск сторінки
loadExisting();
</script>
</body>
</html>
